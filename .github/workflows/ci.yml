name: CI
on:
  push:
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci
        if: hashFiles('package-lock.json') != ''
      - run: npm run lint --if-present
      - run: npm run build --if-present
      - run: npm test --if-present
