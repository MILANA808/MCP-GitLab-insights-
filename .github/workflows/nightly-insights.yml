name: Nightly GitLab Insights
on:
  schedule:
    - cron: '7 1 * * *'
  workflow_dispatch:
jobs:
  insights:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci
        if: hashFiles('package-lock.json') != ''
      - run: |
          echo "MCP_GITLAB_SERVER_URL=${{ secrets.MCP_GITLAB_SERVER_URL }}" >> .env
          npm run build --if-present
          node dist/index.js --config ./scripts/sample.config.json
      - name: Commit reports
        run: |
          git config user.name 'aksi-bot'
          git config user.email 'bot@users.noreply.github.com'
          git add reports/
          git commit -m 'chore(reports): nightly GitLab insights' || echo 'no changes'
          git push
