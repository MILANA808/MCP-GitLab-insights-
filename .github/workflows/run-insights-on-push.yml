name: Run Insights on Push
on:
  push:
    branches: [ feat/mcp-insights-core ]
  workflow_dispatch:
jobs:
  run-insights:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      MCP_GITLAB_SERVER_URL: ${{ secrets.MCP_GITLAB_SERVER_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci
        if: hashFiles('package-lock.json') != ''
      - name: Build
        run: npm run build --if-present
      - name: Run insights (conditional)
        if: env.MCP_GITLAB_SERVER_URL != ''
        run: node dist/index.js --config ./scripts/sample.config.json
      - name: No secret set — skip insights
        if: env.MCP_GITLAB_SERVER_URL == ''
        run: echo 'MCP_GITLAB_SERVER_URL is not set — skipping insights generation'
      - name: Commit reports (if any)
        run: |
          git config user.name 'aksi-bot'
          git config user.email 'bot@users.noreply.github.com'
          git add reports/ || true
          git commit -m 'chore(reports): push-triggered insights' || echo 'no changes'
          git push || true
